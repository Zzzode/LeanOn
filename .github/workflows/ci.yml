name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated icon resources
        run: pnpm icons:check

      # Build first: `pnpm -r run build` runs in dependency-topological order,
      # and packages resolve workspace siblings (e.g. pages -> core) through the
      # built dist/declarations. Typecheck after the artifacts exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundle
        # Topological build (core before pages) so Rspack can resolve
        # @zzzode/core; prepareLynxAssets then stages pages/dist into assets.
        run: pnpm build

      - name: Install Android 35 platform
        # ubuntu-latest ships the Android SDK; accept licenses and add the
        # platform/build-tools we target (avoids the setup-android 'tools' issue).
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls -d "$ANDROID_SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"

      - name: Run JVM unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
