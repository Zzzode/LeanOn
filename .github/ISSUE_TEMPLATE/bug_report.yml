name: Bug report
description: Report a problem with LeanOn
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / package version
      placeholder: e.g. 0.0.1
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See error
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, device model, etc.
