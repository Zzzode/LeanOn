# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# Then run `pod install` and open LeanOn.xcworkspace.
# The generated .xcodeproj, Pods and .xcworkspace are intentionally not committed.
name: LeanOn

options:
  bundleIdPrefix: com.zzzode
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  LeanOn:
    type: application
    platform: iOS
    sources:
      - path: LeanOn
      # Shared Lynx bundle; build it first with
      # `pnpm --filter @zzzode/pages build` (mirrors prepareLynxAssets on Android).
      - path: ../../packages/pages/dist/main.lynx.bundle
      # Bootstrap data lives at LeanOn/Resources/hostData.json (covered by the
      # LeanOn source path) and is kept in sync with the Android seed.
    info:
      path: LeanOn/Info.plist
      properties:
        # Enables native full-screen resolution; without it the app launches in
        # a 320x480 compatibility mode with black top/bottom bars.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzode.leanon
        SWIFT_OBJC_BRIDGING_HEADER: LeanOn/LeanOn-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Command-line/CI launches (simctl) do not benefit from the debug dylib
        # and it can interfere with UIKit scene setup; link a normal binary.
        ENABLE_DEBUG_DYLIB: "NO"

  LeanOnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeanOnTests
    dependencies:
      - target: LeanOn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzode.leanon.tests

schemes:
  LeanOn:
    build:
      targets:
        LeanOn: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LeanOnTests
