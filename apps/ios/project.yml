# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# Then run `pod install` and open LeanOn.xcworkspace.
# The generated .xcodeproj, Pods and .xcworkspace are intentionally not committed.
name: LeanOn

options:
  bundleIdPrefix: com.zzzode
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  LeanOn:
    type: application
    platform: iOS
    sources:
      - path: LeanOn
      # Shared Lynx bundle; build it first with
      # `pnpm --filter @zzzode/pages build` (mirrors prepareLynxAssets on Android).
      - path: ../../packages/pages/dist/main.lynx.bundle
      # Bootstrap data lives at LeanOn/Resources/hostData.json (covered by the
      # LeanOn source path) and is kept in sync with the Android seed.
    info:
      path: LeanOn/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzode.leanon
        SWIFT_OBJC_BRIDGING_HEADER: LeanOn/LeanOn-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Command-line/CI launches (simctl) do not benefit from the debug dylib
        # and it can interfere with UIKit scene setup; link a normal binary.
        ENABLE_DEBUG_DYLIB: "NO"

schemes:
  LeanOn:
    build:
      targets:
        LeanOn: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LeanOn
