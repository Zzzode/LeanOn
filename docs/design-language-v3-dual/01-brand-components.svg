<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1650" viewBox="0 0 1800 1650"><style>text{font-family:PingFang SC,Helvetica Neue,sans-serif}</style><rect x="0" y="0" width="1800" height="1650" rx="0" fill="#F8F7F4" stroke="none"/><rect x="0" y="0" width="1800" height="160" rx="0" fill="#F8F7F4" stroke="none"/><g transform="translate(52 40) scale(0.03189792663476874)" fill="#573C58">
    <path d="M630 414 C550 281 442 179 328 179 C193 179 94 289 94 440 C94 696 313 876 566 1050 C585 1063 602 1084 612 1101 C618 1112 629 1115 637 1103 C647 1087 661 1076 678 1064 C938 879 1162 701 1162 439 C1162 286 1065 177 939 177 C819 177 708 279 630 414 Z"/>
    <path d="M630 414 C708 279 819 177 939 177 C1065 177 1162 286 1162 439 C1162 701 938 879 678 1064 C661 1076 647 1087 637 1103 C645 1077 652 1049 642 1014 C631 972 609 935 583 894 C545 836 520 784 526 693 C532 604 580 503 630 414 Z"/>
  </g><text x="104" y="71" font-size="23" font-weight="600" fill="#573C58" >LeanOn  /  SOFT MOMENTUM</text><text x="1748" y="70" font-size="20" font-weight="500" fill="#69616B" text-anchor="end">01 / BRAND + COMPONENTS · v3</text><text x="52" y="121" font-size="30" font-weight="600" fill="#28242C" >轻一点，靠近一点。</text><text x="52" y="152" font-size="16" font-weight="400" fill="#69616B" >多色语义保留；阅读秩序交给空间、字体和准确的强调。静态设计提案</text><g transform="translate(56 216) scale(0.03827751196172249)" fill="#573C58">
    <path d="M630 414 C550 281 442 179 328 179 C193 179 94 289 94 440 C94 696 313 876 566 1050 C585 1063 602 1084 612 1101 C618 1112 629 1115 637 1103 C647 1087 661 1076 678 1064 C938 879 1162 701 1162 439 C1162 286 1065 177 939 177 C819 177 708 279 630 414 Z"/>
    <path d="M630 414 C708 279 819 177 939 177 C1065 177 1162 286 1162 439 C1162 701 938 879 678 1064 C661 1076 647 1087 637 1103 C645 1077 652 1049 642 1014 C631 972 609 935 583 894 C545 836 520 784 526 693 C532 604 580 503 630 414 Z"/>
  </g><text x="123" y="252" font-size="42" font-weight="500" fill="#573C58" >LeanOn</text><text x="56" y="326" font-size="36" font-weight="500" fill="#28242C" >Lighter days. Together.</text><text x="56" y="373" font-size="20" font-weight="400" fill="#69616B" >品牌出现在需要陪伴的时刻，工具页直接说明功能。</text><g transform="translate(1190 224) scale(1)"><g transform="rotate(9 66 96)"><rect x="41" y="39" width="52" height="96" rx="26" fill="#EDEAF7" stroke="none"/><circle cx="67" cy="23" r="11" fill="#7563B1"/></g><g transform="rotate(-9 116 96)"><rect x="90" y="34" width="52" height="101" rx="26" fill="#F8E7EF" stroke="none"/><circle cx="116" cy="18" r="11" fill="#B75B7B"/></g><path d="M34 140L153 140" fill="none" stroke="#573C58" stroke-width="2" stroke-linecap="round"/></g><text x="1430" y="275" font-size="26" font-weight="500" fill="#28242C" >两个节奏，</text><text x="1430" y="315" font-size="26" font-weight="500" fill="#28242C" >一条支撑线。</text><path d="M52 424L1748 424" fill="none" stroke="#E5DED8" stroke-width="1" /><text x="52" y="478" font-size="24" font-weight="600" fill="#28242C" >01  多色服务识别，不给每个区块填背景</text><text x="52" y="514" font-size="17" font-weight="400" fill="#69616B" >单屏以 80–90% 中性空间为构图目标；强色约 3–5%，浅色只在必要的选择与状态中出现。</text><rect x="52" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="84" cy="575" r="12" fill="#573C58"/><text x="112" y="584" font-size="21" font-weight="500" fill="#28242C" >品牌</text><text x="72" y="628" font-size="15" font-weight="400" fill="#69616B" >#573C58</text><rect x="337" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="369" cy="575" r="12" fill="#C35445"/><text x="397" y="584" font-size="21" font-weight="500" fill="#28242C" >饮食</text><text x="357" y="628" font-size="15" font-weight="400" fill="#69616B" >#C35445</text><rect x="622" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="654" cy="575" r="12" fill="#177D89"/><text x="682" y="584" font-size="21" font-weight="500" fill="#28242C" >运动</text><text x="642" y="628" font-size="15" font-weight="400" fill="#69616B" >#177D89</text><rect x="907" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="939" cy="575" r="12" fill="#7563B1"/><text x="967" y="584" font-size="21" font-weight="500" fill="#28242C" >体重</text><text x="927" y="628" font-size="15" font-weight="400" fill="#69616B" >#7563B1</text><rect x="1192" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="1224" cy="575" r="12" fill="#BD8532"/><text x="1252" y="584" font-size="21" font-weight="500" fill="#28242C" >饮水</text><text x="1212" y="628" font-size="15" font-weight="400" fill="#69616B" >#BD8532</text><rect x="1477" y="543" width="260" height="109" rx="14" fill="#FFFFFF" stroke="none"/><circle cx="1509" cy="575" r="12" fill="#B75B7B"/><text x="1537" y="584" font-size="21" font-weight="500" fill="#28242C" >关系</text><text x="1497" y="628" font-size="15" font-weight="400" fill="#69616B" >#B75B7B</text><text x="52" y="690" font-size="17" font-weight="400" fill="#69616B" >青蓝只指运动；琥珀只指饮水。宏量营养使用中性数字，提醒与通用工具用中性图标。</text><text x="52" y="758" font-size="24" font-weight="600" fill="#28242C" >02  一个主数字，其他信息回到合适的层级</text><text x="52" y="805" font-size="27" font-weight="600" fill="#28242C" >今天，慢慢来。</text><text x="52" y="838" font-size="17" font-weight="400" fill="#69616B" >标题 26–28 / 600 · 常规行 16 / 400–500 · 状态说明 14</text><text x="52" y="931" font-size="52" font-weight="500" fill="#28242C" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">1,310</text><text x="209" y="929" font-size="16" font-weight="400" fill="#69616B" >kcal</text><text x="418" y="931" font-size="32" font-weight="500" fill="#28242C" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">80.4</text><text x="502" y="929" font-size="14" font-weight="400" fill="#69616B" >kg</text><text x="52" y="987" font-size="17" font-weight="400" fill="#69616B" >系统字体 + 苹方 · 等宽数字 · 保留单位 · 不靠低对比度制造精致感</text><text x="920" y="758" font-size="24" font-weight="600" fill="#28242C" >03  只让主动作成为色块</text><rect x="920" y="800" width="241" height="52" rx="12" fill="#93392F" stroke="none"/><g transform="translate(947 815) scale(0.9583333333333334)" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v7m4-7v7M3 7h8m-4 3v11M17 3v18m0-18c5 4 5 9 0 9"/></g><text x="984" y="833" font-size="16" font-weight="500" fill="#FFFFFF" >记饮食</text><g transform="translate(1220 815) scale(0.9583333333333334)" stroke="#5E4C96" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v16H4zM8 9c2-3 6-3 8 0m-4 0 2-3"/></g><text x="1260" y="833" font-size="16" font-weight="500" fill="#28242C" >体重</text><g transform="translate(1410 815) scale(0.9583333333333334)" stroke="#11606B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8M6 9v6m12-6v6M3 10v4m18-4v4M6 12h12"/></g><text x="1450" y="833" font-size="16" font-weight="500" fill="#28242C" >运动</text><rect x="920" y="888" width="828" height="62" rx="11" fill="#FFFFFF" stroke="#E5DED8"/><g transform="translate(940 908) scale(0.9583333333333334)" stroke="#69616B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M15 15l6 6"/></g><text x="982" y="928" font-size="16" font-weight="400" fill="#69616B" >搜索食物</text><text x="920" y="987" font-size="17" font-weight="400" fill="#69616B" >主卡 20–24 / 控件 10–12 · 每屏 1–2 个主要容器，其余开放排版</text><path d="M52 1042L1748 1042" fill="none" stroke="#E5DED8" stroke-width="1" /><text x="52" y="1098" font-size="24" font-weight="600" fill="#28242C" >04  深色，同样克制</text><rect x="52" y="1120" width="819" height="242" rx="22" fill="#201D26" stroke="none"/><text x="80" y="1164" font-size="16" font-weight="500" fill="#F09B84" >今天的饮食</text><text x="80" y="1234" font-size="48" font-weight="500" fill="#FAF5F3" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">1,310</text><text x="227" y="1232" font-size="16" font-weight="400" fill="#CEC3CE" >kcal</text><rect x="80" y="1260" width="734" height="5" rx="3" fill="#443D48" stroke="none"/><rect x="80" y="1260" width="426" height="5" rx="3" fill="#F09B84" stroke="none"/><text x="80" y="1324" font-size="17" font-weight="400" fill="#CEC3CE" >深色表面 + 类别线条，保持可读对比度。</text><text x="920" y="1138" font-size="23" font-weight="500" fill="#28242C" >空间与动态</text><text x="920" y="1185" font-size="18" font-weight="400" fill="#69616B" >4 pt 网格 / 页面边距 24 / 主要区块间距 24–32</text><text x="920" y="1226" font-size="18" font-weight="400" fill="#69616B" >按压 120 ms / 弹层 180–220 ms / 减少动态时淡入</text><text x="920" y="1267" font-size="18" font-weight="400" fill="#69616B" >图标 24 px / 1.8 px 圆线端 / iOS 44 pt、Android 48 dp</text><text x="920" y="1325" font-size="18" font-weight="500" fill="#573C58" >原生底栏形态、颜色和动画保持不变。</text><path d="M52 1420L1748 1420" fill="none" stroke="#E5DED8" stroke-width="1" /><text x="52" y="1471" font-size="22" font-weight="500" fill="#28242C" >保留温度，降低表达频率。</text><text x="52" y="1514" font-size="18" font-weight="400" fill="#69616B" >Today 与 Partner 可以有人情味；Me 与 Settings 用直接功能语言。</text><text x="52" y="1557" font-size="17" font-weight="400" fill="#69616B" >不庆祝少吃、不比较身体、不把缺失记录补零；Logo 原轮廓保留，装饰图形不替代 Logo。</text><text x="52" y="1601" font-size="16" font-weight="400" fill="#69616B" >比例是构图指导，不是已量测的像素结论；小屏、大字体、键盘和辅助技术仍须原生验证。</text></svg>