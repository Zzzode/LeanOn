  </g><text x="105" y="72" font-size="26" font-weight="500" fill="#D3B2D8" >LeanOn / DARK STATES</text><text x="52" y="130" font-size="30" font-weight="600" fill="#FAF5F3" >状态、输入与行动完整对应</text><text x="52" y="168" font-size="18" font-weight="400" fill="#CEC3CE" >静态设计规范；系统键盘、原生导航和持久化需在实现后验证。</text><rect x="52" y="220" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="76" y="262" font-size="14" font-weight="400" fill="#CEC3CE" >确认空</text><text x="76" y="319" font-size="24" font-weight="500" fill="#FAF5F3" >还没有饮食记录</text><text x="76" y="362" font-size="16" font-weight="400" fill="#CEC3CE" >不把缺失数据读成 0 摄入。</text><rect x="76" y="402" width="500" height="56" rx="12" fill="#49312C" stroke="none"/><text x="97" y="437" font-size="16" font-weight="500" fill="#F09B84" >添加食物</text><text x="76" y="542" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="76" y="577" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="624" y="220" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="648" y="262" font-size="14" font-weight="400" fill="#CEC3CE" >无体重</text><text x="648" y="319" font-size="24" font-weight="500" fill="#FAF5F3" >先记录，稍后再估算</text><text x="648" y="362" font-size="16" font-weight="400" fill="#CEC3CE" >饮食可先保存，TDEE 暂不显示。</text><rect x="648" y="402" width="500" height="56" rx="12" fill="#39314A" stroke="none"/><text x="669" y="437" font-size="16" font-weight="500" fill="#BCAAF0" >记录体重</text><text x="648" y="542" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="648" y="577" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="1196" y="220" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="1220" y="262" font-size="14" font-weight="400" fill="#CEC3CE" >载入中</text><text x="1220" y="319" font-size="24" font-weight="500" fill="#FAF5F3" >正在读取本机记录…</text><text x="1220" y="362" font-size="16" font-weight="400" fill="#CEC3CE" >保持画布与位置；不显示假记录。</text><rect x="1220" y="402" width="500" height="56" rx="12" fill="#37323D" stroke="none"/><text x="1241" y="437" font-size="16" font-weight="500" fill="#D3B2D8" >正在读取…</text><text x="1220" y="542" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="1220" y="577" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="52" y="694" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="76" y="736" font-size="14" font-weight="400" fill="#CEC3CE" >读取失败</text><text x="76" y="793" font-size="24" font-weight="500" fill="#FAF5F3" >暂时无法读取记录</text><text x="76" y="836" font-size="16" font-weight="400" fill="#CEC3CE" >不以演示数据冒充本地数据。</text><rect x="76" y="876" width="500" height="56" rx="12" fill="#403047" stroke="none"/><text x="97" y="911" font-size="16" font-weight="500" fill="#D3B2D8" >重新打开应用</text><text x="76" y="1016" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="76" y="1051" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="624" y="694" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="648" y="736" font-size="14" font-weight="400" fill="#CEC3CE" >搜索</text><text x="648" y="793" font-size="24" font-weight="500" fill="#FAF5F3" >搜索食物</text><text x="648" y="836" font-size="16" font-weight="400" fill="#CEC3CE" >保留查询和最近使用。</text><rect x="648" y="876" width="500" height="56" rx="12" fill="#49312C" stroke="none"/><text x="669" y="911" font-size="16" font-weight="500" fill="#F09B84" >白米饭 · 130 kcal/100g</text><text x="648" y="1016" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="648" y="1051" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="1196" y="694" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="1220" y="736" font-size="14" font-weight="400" fill="#CEC3CE" >无结果</text><text x="1220" y="793" font-size="24" font-weight="500" fill="#FAF5F3" >没有找到这个食物</text><text x="1220" y="836" font-size="16" font-weight="400" fill="#CEC3CE" >能力允许时再提供自定义添加。</text><rect x="1220" y="876" width="500" height="56" rx="12" fill="#49312C" stroke="none"/><text x="1241" y="911" font-size="16" font-weight="500" fill="#F09B84" >检查名称或换个关键词</text><text x="1220" y="1016" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="1220" y="1051" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="52" y="1168" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="76" y="1210" font-size="14" font-weight="400" fill="#CEC3CE" >输入焦点</text><text x="76" y="1267" font-size="24" font-weight="500" fill="#FAF5F3" >份量</text><text x="76" y="1310" font-size="16" font-weight="400" fill="#CEC3CE" >焦点边界清楚，单位不充当标签。</text><rect x="76" y="1350" width="500" height="74" rx="12" fill="#201D26" stroke="#F09B84"/><text x="97" y="1401" font-size="30" font-weight="500" fill="#FAF5F3" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">100 g</text><text x="76" y="1490" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="76" y="1525" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="624" y="1168" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="648" y="1210" font-size="14" font-weight="400" fill="#CEC3CE" >校验错误</text><text x="648" y="1267" font-size="24" font-weight="500" fill="#FAF5F3" >请输入 20–300 kg</text><text x="648" y="1310" font-size="16" font-weight="400" fill="#CEC3CE" >保留输入；错误紧邻字段。</text><rect x="648" y="1350" width="500" height="74" rx="12" fill="#201D26" stroke="#FF949C"/><text x="669" y="1401" font-size="30" font-weight="500" fill="#FAF5F3" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">0 kg</text><text x="648" y="1490" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="648" y="1525" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="1196" y="1168" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="1220" y="1210" font-size="14" font-weight="400" fill="#CEC3CE" >保存中</text><text x="1220" y="1267" font-size="24" font-weight="500" fill="#FAF5F3" >正在保存…</text><text x="1220" y="1310" font-size="16" font-weight="400" fill="#CEC3CE" >禁止重复写入；写完后再关闭。</text><rect x="1220" y="1350" width="500" height="56" rx="12" fill="#37323D" stroke="none"/><text x="1241" y="1385" font-size="16" font-weight="500" fill="#CEC3CE" >保存中…</text><text x="1220" y="1490" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="1220" y="1525" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="52" y="1642" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="76" y="1684" font-size="14" font-weight="400" fill="#CEC3CE" >保存失败</text><text x="76" y="1741" font-size="24" font-weight="500" fill="#FAF5F3" >这次没有保存成功</text><text x="76" y="1784" font-size="16" font-weight="400" fill="#CEC3CE" >保留草稿，允许重试或取消。</text><rect x="76" y="1824" width="500" height="56" rx="12" fill="#403047" stroke="none"/><text x="97" y="1859" font-size="16" font-weight="500" fill="#D3B2D8" >重试保存</text><text x="76" y="1964" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="76" y="1999" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="624" y="1642" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="648" y="1684" font-size="14" font-weight="400" fill="#CEC3CE" >能力不可用</text><text x="648" y="1741" font-size="24" font-weight="500" fill="#FAF5F3" >iOS 暂未接入健康数据</text><text x="648" y="1784" font-size="16" font-weight="400" fill="#CEC3CE" >只解释状态，不画已连接或同步。</text><rect x="648" y="1824" width="500" height="56" rx="12" fill="#482E3C" stroke="none"/><text x="669" y="1859" font-size="16" font-weight="500" fill="#EAA6BF" >知道了</text><text x="648" y="1964" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="648" y="1999" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><rect x="1196" y="1642" width="548" height="432" rx="20" fill="#2B2731" stroke="none"/><text x="1220" y="1684" font-size="14" font-weight="400" fill="#CEC3CE" >禁用／选中</text><text x="1220" y="1741" font-size="24" font-weight="500" fill="#FAF5F3" >外观：跟随系统</text><text x="1220" y="1784" font-size="16" font-weight="400" fill="#CEC3CE" >勾选与文字同时表达状态。</text><rect x="1220" y="1824" width="500" height="56" rx="12" fill="#37323D" stroke="none"/><text x="1241" y="1859" font-size="16" font-weight="500" fill="#CEC3CE" >已跟随系统 · 深色</text><g transform="translate(1666 1839) scale(0.9166666666666666)" stroke="#D3B2D8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></g><text x="1220" y="1964" font-size="15" font-weight="400" fill="#CEC3CE" >正文 16 · 辅助 14 · 点击区域 ≥48</text><text x="1220" y="1999" font-size="15" font-weight="400" fill="#CEC3CE" >取消保留流程；保存以真实返回为准。</text><text x="52" y="2185" font-size="17" font-weight="400" fill="#CEC3CE" >已检查文字与字段边界色对；不代表完整读屏、大字或原生交互验证。</text></svg>