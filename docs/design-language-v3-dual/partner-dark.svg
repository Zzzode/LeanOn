  </g><text x="51" y="75" font-size="16" font-weight="500" fill="#D3B2D8" >LeanOn</text><text x="378" y="74" font-size="12" font-weight="400" fill="#CEC3CE" text-anchor="end">示例</text><text x="24" y="119" font-size="27" font-weight="600" fill="#FAF5F3" >一起</text><text x="24" y="148" font-size="14" font-weight="400" fill="#CEC3CE" >伴侣功能尚未开放</text><g transform="translate(110 189) scale(1)"><g transform="rotate(9 66 96)"><rect x="41" y="39" width="52" height="96" rx="26" fill="#39314A" stroke="none"/><circle cx="67" cy="23" r="11" fill="#BCAAF0"/></g><g transform="rotate(-9 116 96)"><rect x="90" y="34" width="52" height="101" rx="26" fill="#482E3C" stroke="none"/><circle cx="116" cy="18" r="11" fill="#EAA6BF"/></g><path d="M34 140L153 140" fill="none" stroke="#D3B2D8" stroke-width="2" stroke-linecap="round"/></g><text x="24" y="390" font-size="26" font-weight="500" fill="#FAF5F3" >一起，慢慢变好。</text><text x="24" y="430" font-size="16" font-weight="400" fill="#CEC3CE" >不用比较谁更快。</text><text x="24" y="460" font-size="16" font-weight="400" fill="#CEC3CE" >散步、吃饭，或一句关心。</text><path d="M24 505L378 505" fill="none" stroke="#443D48" stroke-width="1" /><text x="24" y="542" font-size="17" font-weight="500" fill="#FAF5F3" >当前状态</text><g transform="translate(24 565) scale(0.8333333333333334)" stroke="#EAA6BF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6zM8 10V6a4 4 0 0 1 8 0v4"/></g><text x="56" y="582" font-size="16" font-weight="400" fill="#FAF5F3" >你的记录保存在本机。</text><text x="24" y="614" font-size="14" font-weight="400" fill="#CEC3CE" >还没有伴侣连接、同步或消息发送。</text><text x="24" y="680" font-size="16" font-weight="500" fill="#D3B2D8" >查看设置</text><g transform="translate(112 663) scale(0.875)" stroke="#D3B2D8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></g><rect x="16" y="788" width="370" height="79" rx="39" fill="#2B2731" stroke="#443D48"/><rect x="242" y="795" width="70"