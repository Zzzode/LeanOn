  </g><text x="104" y="71" font-size="23" font-weight="600" fill="#573C58" >LeanOn  /  SOFT MOMENTUM</text><text x="1748" y="70" font-size="20" font-weight="500" fill="#69616B" text-anchor="end">01 / BRAND + COMPONENTS</text><text x="52" y="121" font-size="30" font-weight="600" fill="#28242C" >轻一点，靠近一点。</text><text x="52" y="152" font-size="16" font-weight="400" fill="#69616B" >品牌识别 + 类别颜色 + 留白秩序。设计提案 · 非原生运行截图</text><rect x="52" y="194" width="1070" height="250" rx="20" fill="#573C58" stroke="none"/><g transform="translate(85 230) scale(0.044657097288676235)" fill="#FFFDFA">
