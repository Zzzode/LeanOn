  </g><text x="163" y="273" font-size="47" font-weight="600" fill="#FFFDFA" >LeanOn</text><text x="86" y="347" font-size="38" font-weight="500" fill="#FFFDFA" >Lighter days. Together.</text><text x="86" y="405" font-size="23" font-weight="400" fill="#EADCEA" >可持续的每一天，比一次冲刺更重要。</text><g transform="translate(1200 213) scale(1.14)"><rect x="3" y="24" width="118" height="161" rx="58" fill="#EDEAF7" stroke="none"/><rect x="96" y="3" width="118" height="182" rx="58" fill="#F8E7EF" stroke="none"/><rect x="54" y="65" width="118" height="120" rx="58" fill="#F0E7F1" stroke="none"/><circle cx="63" cy="70" r="14" fill="#7563B1"/><circle cx="155" cy="52" r="14" fill="#B75B7B"/><path d="M64 104L109 140" fill="none" stroke="#7563B1" stroke-width="16" stroke-linecap="round"/><path d="M155 90L111 140" fill="none" stroke="#B75B7B" stroke-width="16" stroke-linecap="round"/><rect x="22" y="182" width="174" height="5" rx="3" fill="#573C58" stroke="none"/></g><text x="1467" y="276" font-size="29" font-weight="600" fill="#573C58" >两个人，</text><text x="1467" y="321" font-size="29" font-weight="600" fill="#573C58" >各自的节奏。</text><text x="1467" y="376" font-size="18" font-weight="400" fill="#69616B" >同一条支撑线。</text><text x="52" y="501" font-size="25" font-weight="600" fill="#28242C" >01  颜色表达角色，不评价身体</text><text x="52" y="533" font-size="16" font-weight="400" fill="#69616B" >安静底色 70–80% · 类别浅色 15–20% · 强色与品牌锚点 5–10%（构图预算）</text><rect x="52" y="565" width="260" height="126" rx="20" fill="#F0E7F1" stroke="none"/><rect x="70" y="583" width="50" height="50" rx="14" fill="#573C58" stroke="none"/><text x="137" y="610" font-size="23" font-weight="600" fill="#573C58" >品牌</text><text x="70" y="666" font-size="16" font-weight="500" fill="#28242C" >#573C58</text><rect x="337" y="565" width="260" height="126" rx="20" fill="#FBEAE4" stroke="none"/><rect x="355" y="583" width="50" height="50" rx="14" fill="#C35445" stroke="none"/><text x="422" y="610" font-size="23" font-weight="600" fill="#93392F" >饮食</text><text x="355" y="666" font-size="16" font-weight="500" fill="#28242C" >#C35445</text><rect x="622" y="565" width="260" height="126" rx="20" fill="#E3F1F1" stroke="none"/><rect x="640" y="583" width="50" height="50" rx="14" fill="#177D89" stroke="none"/><text x="707" y="610" font-size="23" font-weight="600" fill="#11606B" >运动</text><text x="640" y="666" font-size="16" font-weight="500" fill="#28242C" >#177D89</text><rect x="907" y="565" width="260" height="126" rx="20" fill="#EDEAF7" stroke="none"/><rect x="925" y="583" width="50" height="50" rx="14" fill="#7563B1" stroke="none"/><text x="992" y="610" font-size="23" font-weight="600" fill="#5E4C96" >体重</text><text x="925" y="666" font-size="16" font-weight="500" fill="#28242C" >#7563B1</text><rect x="1192" y="565" width="260" height="126" rx="20" fill="#FBF0D9" stroke="none"/><rect x="1210" y="583" width="50" height="50" rx="14" fill="#BD8532" stroke="none"/><text x="1277" y="610" font-size="23" font-weight="600" fill="#805619" >饮水</text><text x="1210" y="666" font-size="16" font-weight="500" fill="#28242C" >#BD8532</text><rect x="1477" y="565" width="260" height="126" rx="20" fill="#F8E7EF" stroke="none"/><rect x="1495" y="583" width="50" height="50" rx="14" fill="#B75B7B" stroke="none"/><text x="1562" y="610" font-size="23" font-weight="600" fill="#91435F" >关系</text><text x="1495" y="666" font-size="16" font-weight="500" fill="#28242C" >#B75B7B</text><text x="52" y="748" font-size="25" font-weight="600" fill="#28242C" >02  让数字说清楚，让文字留有人情味</text><rect x="52" y="774" width="819" height="287" rx="20" fill="#FFFDFA" stroke="none"/><text x="80" y="818" font-size="32" font-weight="600" fill="#28242C" >今天，慢慢来。</text><text x="80" y="852" font-size="18" font-weight="400" fill="#69616B" >中文标题 30 / 600 · 正文 16 / 400 · 辅助 14 / 400</text><text x="80" y="949" font-size="68" font-weight="600" fill="#28242C" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">80.4</text><text x="260" y="945" font-size="20" font-weight="400" fill="#69616B" >kg</text><text x="418" y="949" font-size="62" font-weight="600" fill="#28242C" font-family="Avenir Next, Helvetica Neue, sans-serif" style="font-variant-numeric:tabular-nums" letter-spacing="-1.2">1,310</text><text x="588" y="945" font-size="18" font-weight="400" fill="#69616B" >kcal</text><text x="80" y="1015" font-size="17" font-weight="400" fill="#69616B" >原生系统字体 · 等宽数字 · 小数对齐 · 单位始终保留</text><rect x="899" y="774" width="849" height="287" rx="20" fill="#FFFDFA" stroke="none"/><text x="927" y="818" font-size="25" font-weight="600" fill="#28242C" >03  一个系统，多种任务节奏</text><rect x="927" y="853" width="235" height="54" rx="16" fill="#573C58" stroke="none"/><text x="1045" y="887" font-size="18" font-weight="600" fill="#FFFDFA" text-anchor="middle">保存记录</text><rect x="1186" y="853" width="235" height="54" rx="16" fill="#FBEAE4" stroke="none"/><g transform="translate(1208 868) scale(1)" stroke="#93392F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v7m4-7v7M3 7h8m-4 3v11M17 3v18m0-18c5 4 5 9 0 9"/></g><text x="1246" y="888" font-size="17" font-weight="600" fill="#93392F" >添加食物</text><rect x="1445" y="853" width="275" height="54" rx="16" fill="#FFFDFA" stroke="#E5DED8"/><g transform="translate(1463 868) scale(0.9583333333333334)" stroke="#69616B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M15 15l6 6"/></g><text x="1502" y="888" font-size="17" font-weight="400" fill="#69616B" >搜索食物</text><rect x="927" y="940" width="68" height="68" rx="18" fill="#FBEAE4" stroke="none"/><g transform="translate(947 960) scale(1.1666666666666667)" stroke="#93392F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v7m4-7v7M3 7h8m-4 3v11M17 3v18m0-18c5 4 5 9 0 9"/></g><rect x="1052" y="940" width="68" height="68" rx="18" fill="#E3F1F1" stroke="none"/><g transform="translate(1072 960) scale(1.1666666666666667)" stroke="#11606B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8M6 9v6m12-6v6M3 10v4m18-4v4M6 12h12"/></g><rect x="1177" y="940" width="68" height="68" rx="18" fill="#EDEAF7" stroke="none"/><g transform="translate(1197 960) scale(1.1666666666666667)" stroke="#5E4C96" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v16H4zM8 9c2-3 6-3 8 0m-4 0 2-3"/></g><rect x="1302" y="940" width="68" height="68" rx="18" fill="#FBF0D9" stroke="none"/><g transform="translate(1322 960) scale(1.1666666666666667)" stroke="#805619" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0C19 11 15 7 12 2z"/></g><rect x="1427" y="940" width="68" height="68" rx="18" fill="#F8E7EF" stroke="none"/><g transform="translate(1447 960) scale(1.1666666666666667)" stroke="#91435F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20C4 15 1 10 4 6c3-3 6-1 8 2 2-3 5-5 8-2 3 4 0 9-8 14z"/></g><rect x="1552" y="940" width="68" height="68" rx="18" fill="#F0E7F1" stroke="none"/><g transform="translate(1572 960) scale(1.1666666666666667)" stroke="#573C58" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></g><text x="927" y="1040" font-size="16" font-weight="400" fill="#69616B" >24 px 网格 · 1.8 px 圆线端 · 44 pt 最小点击范围</text><text x="52" y="1127" font-size="25" font-weight="600" fill="#28242C" >04  深色模式维持角色与阅读层级</text><rect x="52" y="1152" width="819" height="256" rx="24" fill="#201D26" stroke="none"/><rect x="77" y="1178" width="769" height="86" rx="20" fill="#2B2731" stroke="none"/><text x="102" y="1214" font-size="23" font-weight="600" fill="#FAF5F3" >记录属于你，不用追求每天都下降。</text><text x="102" y="1246" font-size="17" font-weight="400" fill="#CEC3CE" >对比度通过文字、轮廓和层级建立。</text><rect x="79" y="1290" width="127" height="80" rx="16" fill="#49312C" stroke="none"/><g transform="translate(93 1315) scale(1.0833333333333333)" stroke="#F09B84" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v7m4-7v7M3 7h8m-4 3v11M17 3v18m0-18c5 4 5 9 0 9"/></g><text x="79" y="1393" font-size="14" font-weight="400" fill="#CEC3CE" >#F09B84</text><rect x="230" y="1290" width="127" height="80" rx="16" fill="#213B40" stroke="none"/><g transform="translate(244 1315) scale(1.0833333333333333)" stroke="#70C7CC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8M6 9v6m12-6v6M3 10v4m18-4v4M6 12h12"/></g><text x="230" y="1393" font-size="14" font-weight="400" fill="#CEC3CE" >#70C7CC</text><rect x="381" y="1290" width="127" height="80" rx="16" fill="#39314A" stroke="none"/><g transform="translate(395 1315) scale(1.0833333333333333)" stroke="#BCAAF0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v16H4zM8 9c2-3 6-3 8 0m-4 0 2-3"/></g><text x="381" y="1393" font-size="14" font-weight="400" fill="#CEC3CE" >#BCAAF0</text><rect x="532" y="1290" width="127" height="80" rx="16" fill="#443823" stroke="none"/><g transform="translate(546 1315) scale(1.0833333333333333)" stroke="#E7BE71" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0C19 11 15 7 12 2z"/></g><text x="532" y="1393" font-size="14" font-weight="400" fill="#CEC3CE" >#E7BE71</text><rect x="683" y="1290" width="127" height="80" rx="16" fill="#482E3C" stroke="none"/><g transform="translate(697 1315) scale(1.0833333333333333)" stroke="#EAA6BF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20C4 15 1 10 4 6c3-3 6-1 8 2 2-3 5-5 8-2 3 4 0 9-8 14z"/></g><text x="683" y="1393" font-size="14" font-weight="400" fill="#CEC3CE" >#EAA6BF</text><rect x="899" y="1152" width="849" height="256" rx="20" fill="#FFFDFA" stroke="none"/><text x="927" y="1194" font-size="25" font-weight="600" fill="#28242C" >空间与动态</text><text x="927" y="1238" font-size="19" font-weight="400" fill="#69616B" >4 pt 网格 / 页面边距 24 / 区块间距 24</text><text x="927" y="1277" font-size="19" font-weight="400" fill="#69616B" >主卡圆角 24 / 内容 20 / 控件 12–16 / 边线 1</text><text x="927" y="1316" font-size="19" font-weight="400" fill="#69616B" >按压 120 ms / 弹层 180–220 ms / 减少动态时淡入</text><text x="927" y="1355" font-size="19" font-weight="600" fill="#573C58" >已认可的原生底栏形态与动画保持不变。</text><path d="M52 1460L1748 1460" fill="none" stroke="#E5DED8" stroke-width="1" /><text x="52" y="1510" font-size="19" font-weight="600" fill="#573C58" >语气</text><text x="129" y="1510" font-size="21" font-weight="400" fill="#28242C" >“先记下来。”  “给趋势一点时间。”  “今天到这里也可以。”</text><text x="52" y="1563" font-size="19" font-weight="400" fill="#69616B" >避免羞耻、排名和补偿性运动；未记录不填零；体重上下波动不用红绿奖惩。</text><text x="52" y="1621" font-size="17" font-weight="400" fill="#69616B" >原有 Logo 轮廓保留，以单色适配界面；成对形状仅作品牌图形，不替代 Logo。</text></svg>